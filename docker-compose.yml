version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: casino_postgres
    environment:
      POSTGRES_DB: casino_mock
      POSTGRES_USER: casino_admin
      POSTGRES_PASSWORD: casino_pass_2024
    ports:
      - "5433:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - casino_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino_admin -d casino_mock"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: casino_redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - casino_redis_data:/data

volumes:
  casino_postgres_data:
  casino_redis_data: